{% extends "base.html" %}
{% block title %}Edit transaction · Budget Compass{% endblock %}
{% block content %}
<section class="auth-panel panel"><a class="text-link" href="{{ url_for('dashboard') }}">← Back to dashboard</a><p class="eyebrow">TRANSACTION</p><h1>Edit entry</h1>
  <form class="stacked-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="type">Type</label><select id="type" name="type" data-kind-select><option value="expense" {{ 'selected' if item.kind == 'expense' }}>Expense</option><option value="income" {{ 'selected' if item.kind == 'income' }}>Income</option></select>
    <label for="name">Description</label><input id="name" name="name" value="{{ item.name }}" maxlength="80" required>
    <label for="amount">Amount ($)</label><input id="amount" name="amount" type="number" step="0.01" min="0.01" max="9999999.99" value="{{ '%.2f'|format(item.amount_cents / 100) }}" required>
    <label for="entry-category">Category</label><select id="entry-category" name="category" data-category-select><option value="Income" {{ 'selected' if item.category == 'Income' }}>Income</option>{% for option in expense_categories %}<option value="{{ option }}" {{ 'selected' if item.category == option }}>{{ option }}</option>{% endfor %}</select>
    <label for="date">Date</label><input id="date" name="date" type="date" value="{{ item.occurred_on.isoformat() }}" required>
    <button class="button" type="submit">Save changes</button>
  </form>
</section>
{% endblock %}
