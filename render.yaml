services:
  - type: web
    name: budget-compass
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: budget-compass-db
          property: connectionString
databases:
  - name: budget-compass-db
    plan: free
